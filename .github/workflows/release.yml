name: Release

# A tag such as v1.0.1 builds the .oxt and publishes it as a GitHub release, which the update feed
# (update/converter-studio.update.xml) points LibreOffice at. Update the feed and the changelog
# before tagging.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the extension
        run: python3 tools/build.py

      - name: Check that the tag is the extension's version
        run: |
          test -f "dist/converter-studio-${GITHUB_REF_NAME#v}.oxt"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/converter-studio-${GITHUB_REF_NAME#v}.oxt" \
            --title "Converter Studio for LibreOffice ${GITHUB_REF_NAME#v}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/main/CHANGELOG.md)."
