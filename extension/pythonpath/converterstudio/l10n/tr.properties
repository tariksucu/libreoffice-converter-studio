# Hatalar (API kendi iletisini gönderdiyse onun yerine o gösterilir)
error.noKey = Önce Converter Studio API anahtarınızı ekleyin: Converter Studio ▸ Ayarlar. Ücretsiz hesaplar her gün kredi alır.
error.network = converter.studio'ya ulaşılamadı. İnternet bağlantısını ve vekil sunucu ayarlarını denetleyip yeniden deneyin.
error.tls = converter.studio bağlantısı doğrulanamadı: sertifikası kabul edilmedi. Bilgisayarın tarih ve saatini denetleyin; şifreli trafiği inceleyen bir ağ da buna yol açabilir.
error.badResponse = converter.studio bu eklentinin anlamadığı bir yanıt gönderdi. Daha sonra yeniden deneyin ya da eklentiyi güncelleyin.
error.serverBusy = converter.studio şu anda yoğun. Bir dakika sonra yeniden deneyin.
error.unexpectedUrl = Dosya API'ninkinden başka bir adrese gönderilecek ya da oradan alınacaktı; bu yüzden durduruldu.
error.resultTooLarge = Sonuç 1 GB'tan büyük olduğu için indirilmedi.
error.emptyFile = Dosya boş.
error.timeout = Dönüşüm bir saatten uzun sürdü, eklenti beklemeyi bıraktı. Sonuç converter.studio'da yine de çıkabilir.
error.noResult = Dönüşüm indirilecek bir sonuç olmadan bitti.
error.readFile = Dosya okunamadı: {detail}
error.insert = Sonuç alındı ama belgeye konamadı: {detail}
error.badBaseUrl = API adresi https://converter.studio/api gibi bir web adresi olmalı.
error.httpsOnly = API adresi https:// ile başlamalı (düz http yalnız bu bilgisayardaki bir deneme sunucusu için).
error.badKey = API anahtarı boşluk içermeyen tek bir sözcüktür: harfler, rakamlar ve işaretler.
error.other = Bir şeyler ters gitti ({code}).
