# Progress
progressUpload = Sending {name}: {done} of {total}
progressWaiting = Waiting for converter.studio…
progressConvert = Converting {name}: {percent}%
progressDownload = Receiving the result…
cancel = Cancel
ok = OK
confirmCredits = Converting {name} costs {cost}. A file may cost up to {limit} without asking (Converter Studio ▸ Settings). Go ahead?
credit.one = 1 credit
credit.other = {n} credits
busy = Converter Studio is already converting a file. Wait until it has finished.
canceledNote = Stopped. A conversion that had already started on converter.studio still finishes there and counts its credits.

# Settings
settingsTitle = Converter Studio settings
apiKey = API key:
getKey = Get a key…
rememberKey = Remember the key
keyWhereSaved = The key is kept with LibreOffice's passwords for web connections: encrypted, and protected by your master password if you set one (Tools ▸ Options ▸ LibreOffice ▸ Security ▸ Passwords for Web Connections). Without "Remember", it is forgotten when LibreOffice closes.
maxCredits = Ask before a file costs more than
credits = credits
ocrDefaultLanguage = Text recognition:
baseUrl = API address:
checkKey = ~Check
accountOk = Connected as {email}: {plan} plan, {credits} credits left.
privacyNote = The files you convert are sent to converter.studio, converted, and deleted; results are kept for six hours. Nothing else about your documents is sent.
privacyLink = Privacy
save = Save
removeKey = ~Remove the key
keyRemoved = The key was removed.
enableStorageQuestion = LibreOffice is set not to save passwords for web connections. Turn saving on to remember the key? LibreOffice may ask you to set a master password that protects saved passwords.
storageFailed = The key could not be saved with LibreOffice's passwords, so it is kept only until LibreOffice closes.
version = Converter Studio for LibreOffice {version}

# Errors (the API's own message is shown instead when it sends one)
error.noKey = Add your Converter Studio API key first: Converter Studio ▸ Settings. Free accounts get credits every day.
error.network = converter.studio could not be reached. Check the internet connection and the proxy settings, then try again.
error.tls = The connection to converter.studio could not be verified: its certificate was not accepted. Check the computer's date and time; a network that inspects encrypted traffic can also cause this.
error.badResponse = converter.studio sent an answer this extension does not understand. Try again later, or update the extension.
error.serverBusy = converter.studio is busy. Try again in a minute.
error.unexpectedUrl = The file was to be sent to or fetched from another address than the API's, so this was stopped.
error.resultTooLarge = The result is larger than 1 GB and was not downloaded.
error.emptyFile = The file is empty.
error.timeout = The conversion took more than an hour, so the extension stopped waiting. The result may still appear on converter.studio.
error.noResult = The conversion finished without a result to download.
error.readFile = The file could not be read: {detail}
error.insert = The result was received but could not be put into the document: {detail}
error.badBaseUrl = The API address must be a web address such as https://converter.studio/api.
error.httpsOnly = The API address must start with https:// (plain http only for a test server on this computer).
error.badKey = An API key is one word of letters, digits and symbols, without spaces.
error.other = Something went wrong ({code}).
