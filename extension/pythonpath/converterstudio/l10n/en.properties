# Converter Studio for LibreOffice: English texts (the fallback for every other language).
# {name} is filled in when the text is shown. Menu titles are in Addons.xcu.

title = Converter Studio

# Choosing files
pickPicture = Insert a picture through Converter Studio
pickScan = Choose a scan or a photo to read the text of
pickEbook = Choose an e-book to open
filterPictures = Pictures LibreOffice cannot open (HEIC, AVIF, RAW)
filterHeic = iPhone photos (HEIC, HEIF)
filterAvif = AVIF pictures
filterRaw = Camera RAW photos (CR2, NEF, ARW, DNG)
filterScans = Scans and photos (PDF, JPG, PNG, WebP, HEIC, TIFF, BMP)
filterPdf = PDF documents
filterImages = Pictures (JPG, PNG, WebP, HEIC, TIFF, BMP)
filterEbooks = E-books (EPUB, MOBI, AZW3)
unsupportedPicture = Converter Studio inserts HEIC, HEIF and AVIF pictures and camera RAW photos (CR2, NEF, ARW, DNG). LibreOffice opens other pictures itself: use Insert ▸ Image.
unsupportedScan = Choose a PDF or a picture (JPG, PNG, WebP, HEIC, TIFF or BMP).
unsupportedEbook = Choose an EPUB, MOBI or AZW3 e-book. LibreOffice opens FB2 books itself.

